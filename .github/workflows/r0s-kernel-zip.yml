name: A16 r0s GZH3 ExtremeKRNL kernel ZIP (HOST ONLY)

on:
  # Manual marker edit is the only trigger while this workflow stays off
  # the repository's default branch (GitHub requires default for dispatch).
  push:
    branches:
      - sixteen-r0s-kernel-ci
    paths:
      - ci_inputs/r0s_a16_kernel_ci.run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a16-r0s-kernel-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    name: Compile, reconcile, AVB-sign, package native A16 kernel ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      KERNEL_PIN: 78f891e1d3cfbd8095bebdc6cb51f5c80cc52d95
      KERNEL_REMOTE: https://github.com/milxnaq/android_kernel_samsung_s5e9925.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read pinned GZH3 SHA256 donor contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_inputs
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ci_inputs/r0s_a16_gzh3_donors.sha256" \
            -o ci_inputs/r0s_a16_gzh3_donors.sha256


      - name: Download and verify permanent A16 GZH3 donor images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DONOR="$GITHUB_WORKSPACE/out/target/r0s/work_dir/kernel"
          mkdir -p "$DONOR"
          gh release download r0s-a16-gzh3-donors-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'boot.img' \
            --pattern 'vendor_boot.img' \
            --dir "$DONOR"
          test "$(find "$DONOR" -maxdepth 1 -type f | wc -l)" -eq 2
          ( cd "$DONOR" && sha256sum -c \
            "$GITHUB_WORKSPACE/ci_inputs/r0s_a16_gzh3_donors.sha256" )
          test "$(stat -c %s "$DONOR/boot.img")" -eq 29704192
          test "$(stat -c %s "$DONOR/vendor_boot.img")" -eq 24961024
          test "$(head -c 8 "$DONOR/boot.img")" = 'ANDROID!'
          test "$(head -c 8 "$DONOR/vendor_boot.img")" = 'VNDRBOOT'
          echo 'GZH3 A16 permanent donor assets SHA256 / image headers PASS'
          echo 'Reference donors verified; GZH3 reconciliation follows compilation' >> "$GITHUB_STEP_SUMMARY"

      - name: Reclaim disk on disposable GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /usr/local/share/powershell /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo docker builder prune --all --force || true
          df -h /

      - name: Install required kernel build and packaging utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            git make python3 python3-cryptography cpio lz4 zip unzip kmod bc bison flex \
            libssl-dev libelf-dev xz-utils zstd
          for tool in git make python3 cpio lz4 zip depmod modinfo sha256sum; do
            command -v "$tool" >/dev/null
          done

      - name: Refuse inadequate runner disk before cloning
        shell: bash
        run: |
          set -euo pipefail
          free="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
          echo "Runner free space before cloning: $free bytes"
          if (( free < 24 * 1024 * 1024 * 1024 )); then
            echo "::error::Kernel build requires >=24 GiB free after runner cleanup; use a larger runner or adjust build infrastructure, not source pins."
            exit 2
          fi

      - name: Obtain pinned upstream ExtremeKRNL and KernelSU Next (no ROM checkout)
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a16-extremekrnl"
          git clone --single-branch --branch sixteen --filter=blob:none \
            "$KERNEL_REMOTE" "$SRC"
          git -C "$SRC" cat-file -e "$KERNEL_PIN^{commit}"
          git -C "$SRC" checkout --detach "$KERNEL_PIN"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$KERNEL_PIN"
          git -C "$SRC" submodule sync --recursive
          git -C "$SRC" submodule update --init --recursive
          # Resolve the newest stable release once per run; pin that exact commit.
          KSU_TAG="$(gh api repos/KernelSU-Next/KernelSU-Next/releases/latest --jq .tag_name)"
          [[ "$KSU_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          git -C "$SRC/KernelSU-Next" fetch origin "refs/tags/$KSU_TAG:refs/tags/$KSU_TAG"
          KSU_PIN="$(git -C "$SRC/KernelSU-Next" rev-parse "refs/tags/$KSU_TAG^{commit}")"
          git -C "$SRC/KernelSU-Next" checkout --detach "$KSU_PIN"
          test "$(git -C "$SRC/KernelSU-Next" rev-parse HEAD)" = "$KSU_PIN"
          printf 'KSU_TAG=%s\nKSU_PIN=%s\n' "$KSU_TAG" "$KSU_PIN" >> "$GITHUB_ENV"
          printf 'KSU_CACHE_KEY=r0s-a16-extremekrnl-%s-ksu-%s-ubuntu2404-v1\n' "$KERNEL_PIN" "$KSU_PIN" >> "$GITHUB_ENV"
          echo "Latest stable KernelSU Next: $KSU_TAG ($KSU_PIN)"
          grep -Fxq 'CONFIG_KSU=y' "$SRC/arch/arm64/configs/ksu.config"
          grep -Fxq 'SUBLEVEL = 269' "$SRC/Makefile"
          test -f "$SRC/toolchain/mkbootimg/mkbootimg.py"
          echo "A16 exact pinned kernel/KSU source checkout PASS"
          df -h "$SRC"

      - name: Verify remaining room for actual compilation
        shell: bash
        run: |
          set -euo pipefail
          free="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
          echo "Free after checkout: $free bytes"
          if (( free < 12 * 1024 * 1024 * 1024 )); then
            echo "::error::Less than 12 GiB before compiler; no unpinned build or partial artifact will be published."
            exit 2
          fi

      - name: Stage the existing A16 reconciler and packager (no ROM checkout)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/r0s security/avb out/tools/bin
          for file in \
            scripts/r0s/reconcile_extremekrnl_gzh3_a16.py \
            scripts/r0s/package_extremekrnl_update_a16.py \
            scripts/r0s/integrate_extremekrnl_a16.py \
            security/avb/testkey_rsa4096.pem; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$file" \
              --output "$file"
          done
          # Same revision as UN1CA external/android-tools vendor/avb submodule.
          curl --fail --location --retry 3 --silent --show-error \
            'https://android.googlesource.com/platform/external/avb/+/c92ce4cb9a1b6d20a1bc11b7e5864af9f78615bb/avbtool.py?format=TEXT' \
            | base64 --decode > out/tools/bin/avbtool
          test -s out/tools/bin/avbtool
          chmod +x out/tools/bin/avbtool
          SRC="$RUNNER_TEMP/a16-extremekrnl"
          test -s "$SRC/toolchain/mkbootimg/unpack_bootimg.py"
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' \
            "$SRC/toolchain/mkbootimg/unpack_bootimg.py" > out/tools/bin/unpack_bootimg
          chmod +x out/tools/bin/unpack_bootimg
          ln -s "$SRC" out/kernel_tmp-exynos2200
          python3 -m py_compile scripts/r0s/reconcile_extremekrnl_gzh3_a16.py \
            scripts/r0s/package_extremekrnl_update_a16.py \
            scripts/r0s/integrate_extremekrnl_a16.py
          PATH="$GITHUB_WORKSPACE/out/tools/bin:$PATH" \
            python3 scripts/r0s/reconcile_extremekrnl_gzh3_a16.py --self-test
          python3 scripts/r0s/package_extremekrnl_update_a16.py self-test

      - name: Restore exact pinned A16 kernel compilation
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/a16-extremekrnl/build/out/r0s
            ${{ runner.temp }}/a16-extremekrnl/out/.config
          key: ${{ env.KSU_CACHE_KEY }}
          lookup-only: false

      - name: Reuse cached kernel or compile once on cache miss
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a16-extremekrnl"
          # This is the exact invocation in UN1CA's existing
          # scripts/r0s/build_extremekrnl_a16.sh; no forked build system.
          if [[ "${{ steps.compiler_cache.outputs.cache-hit }}" == "true" ]]; then
            echo 'EXACT KERNEL/KSU CACHE HIT: skip compilation.'
          else
            echo 'NO PINNED COMPILER CACHE: compile ONCE and cache immediately.'
            (cd "$SRC" && bash ./build.sh -m r0s -k)
          fi
          grep -Fxq 'CONFIG_KSU=y' "$SRC/out/.config"
          grep -Fxq 'CONFIG_MODVERSIONS=y' "$SRC/out/.config"
          test -s "$SRC/build/out/r0s/boot.img"
          test -s "$SRC/build/out/r0s/vendor_boot.img"
          test -s "$SRC/build/out/r0s/dtbo.img"
          for module in fingerprint fingerprint_sysfs input_booster_lkm sec_debug_coredump wlan; do
            test -s "$SRC/build/out/r0s/modules/lib/modules/$module.ko"
          done
          printf 'source=%s\nksunext=%s\nbuild_only=true\nrom_integrated=false\nboard_pass=false\n' \
            "$KERNEL_PIN" "$KSU_PIN" > "$SRC/build/out/r0s/.r0s_a16_kernel_host_pass"

      - name: Save pinned compilation immediately (before packaging gates)
        if: steps.compiler_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/a16-extremekrnl/build/out/r0s
            ${{ runner.temp }}/a16-extremekrnl/out/.config
          key: ${{ env.KSU_CACHE_KEY }}

      - name: Reconcile current compiled A16 kernel with pinned GZH3 donors
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/out/tools/bin:$PATH"
          python3 scripts/r0s/reconcile_extremekrnl_gzh3_a16.py --ci-donors

      - name: Canonical AVB signing and five-entry ExtremeKRNL update ZIP
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/out/tools/bin:$PATH"
          python3 scripts/r0s/package_extremekrnl_update_a16.py ci-build
          python3 scripts/r0s/package_extremekrnl_update_a16.py ci-verify
          # Direct GitHub Release asset: one .tar.xz enclosing only the
          # validated recovery ZIP. No Actions artifact / outer ZIP.
          shopt -s nullglob
          zips=(out/ExtremeKRNL-*_r0s_KSUNext-*.zip)
          [[ "${#zips[@]}" -eq 1 ]] || { echo 'Expected one verified kernel ZIP' >&2; exit 2; }
          name="$(basename "${zips[0]}")"
          tar -C out -cJf "out/${name%.zip}.tar.xz" "$name"
          [[ "$(tar -tJf "out/${name%.zip}.tar.xz")" == "$name" ]]
          sha256sum "${zips[0]}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Release .tar.xz -> extract -> recovery .zip; A16 BOARD DEFERRED' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish single tar.xz asset as GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(out/ExtremeKRNL-*_r0s_KSUNext-*.tar.xz)
          [[ "${#archives[@]}" -eq 1 ]] || { echo 'Expected one .tar.xz for publication' >&2; exit 2; }
          archive="${archives[0]}"
          name="$(basename "$archive" .tar.xz)"
          [[ "$(tar -tJf "$archive")" == "$name.zip" ]]
          tag="r0s-a16-gzh3-$name"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running the same cached build updates its asset in place.
            gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "ExtremeKRNL v2.5 | KernelSU Next $KSU_TAG | r0s A16" \
              --notes "SM-S901B / GZH3. HOST PASS; A16 device validation pending. Extract the .tar.xz for the TWRP ZIP."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fxq "$name.tar.xz"
          echo "Pre-release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"


