name: A16 r0s GZH3 kernel ZIP reference parity

on:
  push:
    branches: [sixteen-r0s-kernel-ci]
    paths:
      - 'ci_inputs/a16_kernel_reference.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-parity:
    name: Repackage pinned A16 GZH3 five-entry host ZIP (not new kernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact experimental branch and pinned source
        uses: actions/checkout@v4

      - name: Check reference manifest and release asset identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("ci_inputs/a16_kernel_reference.json")
          assert p.is_file(), "Host reference manifest missing: run host uploader first"
          m = json.loads(p.read_text())
          assert m["schema"] == 1 and m["device"] == "SM-S901B"
          assert m["repository"] == "t3st0st3r0n4s/UN1CA"
          assert m["release_tag"] == "r0s-a16-kernel-reference-v1"
          assert m["reference_filename"] == "ExtremeKRNL-v2.5_r0s_KSUNext-v3.4.1_13-10-2026_19-42-41.zip"
          assert len(m["reference_zip_sha256"]) == 64
          PY
          mkdir -p reference
          gh release download r0s-a16-kernel-reference-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ExtremeKRNL-v2.5_r0s_KSUNext-v3.4.1_13-10-2026_19-42-41.zip' \
            --dir reference
          test "$(find reference -type f | wc -l)" = 1

      - name: Verify all source bytes and independently repackage five-member A16 ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r0s/ci_repackage_kernel_reference.py \
            reference/ExtremeKRNL-v2.5_r0s_KSUNext-v3.4.1_13-10-2026_19-42-41.zip \
            ci_inputs/a16_kernel_reference.json \
            dist/
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Exact GZH3 signed reference image bytes, not newly compiled kernel." >> "$GITHUB_STEP_SUMMARY"
          echo "Five-member host ZIP parity only. A16 physical boot unqualified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified canonical-format ZIP (no automatic release)
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-A16-GZH3-REFERENCE-ZIP-NOT-BOARD-QUALIFIED
          path: |
            dist/*.zip
            dist/provenance.json
            dist/SHA256SUMS.txt
            dist/NOT_BOARD_QUALIFIED.txt
          if-no-files-found: error
          retention-days: 7
