name: r0s Android 16 config gate

on:
  workflow_dispatch:
  push:
    branches:
      - sixteen-r0s
    paths:
      - 'target/r0s/**'
      - 'platform/exynos2200/**'
      - 'unica/configs/essi.sh'
      - 'scripts/internal/gen_config_file.sh'
      - 'scripts/ci/check_r0s_config.sh'
      - 'scripts/ci/test_r0s_firmware_inspector.sh'
      - 'scripts/r0s/inspect_extracted_firmware.sh'
      - 'scripts/r0s/inspect_boot_chain.sh'
      - 'scripts/r0s/inspect_recovery_abi.sh'
      - 'scripts/r0s/audit_stock_recovery_updater.sh'
      - 'scripts/r0s/audit_recovery_candidates.sh'
      - 'scripts/r0s/inspect_twrp_gzh3_userspace.py'
      - 'scripts/r0s/audit_recovery_runtime_abi.py'
      - 'scripts/r0s/audit_install_prerequisites.py'
      - 'scripts/r0s/build_full_ota_guarded.py'
      - 'scripts/r0s/build_extremekrnl_a16.sh'
      - 'scripts/r0s/audit_extremekrnl_a16_candidate.sh'
      - 'scripts/r0s/compare_extremekrnl_gzh3_a16.py'
      - 'scripts/r0s/reconcile_extremekrnl_gzh3_a16.py'
      - 'scripts/r0s/integrate_extremekrnl_a16.py'
      - 'scripts/make_rom.sh'
      - 'docs/r0s/CUSTOM_KERNEL_KSU_A16.md'
      - 'scripts/r0s/make_twrp_abort_probe.py'
      - 'scripts/r0s/check_tachyon_rollback_zip.py'
      - 'scripts/r0s/audit_recovery_ota_trust.sh'
      - 'scripts/r0s/check_recovery_ota_certificates.py'
      - 'scripts/ci/test_r0s_recovery_ota_certificates.py'
      - 'scripts/r0s/check_recovery_ota_map.sh'
      - 'scripts/ci/test_r0s_recovery_ota_map.sh'
      - 'scripts/ci/test_r0s_ota_op_list.sh'
      - 'scripts/r0s/inspect_built_workdir.sh'
      - 'scripts/r0s/inspect_postbuild_boot_ramdisks.sh'
      - 'scripts/r0s/check_proca_kernel_delta.py'
      - 'scripts/ci/test_r0s_proca_kernel_delta.py'
      - 'scripts/r0s/check_target_files_zip.py'
      - 'scripts/r0s/preflight_target_files.py'
      - 'scripts/r0s/build_target_files_guarded.sh'
      - 'scripts/r0s/audit_target_files_host.sh'
      - 'scripts/r0s/audit_packaged_kernel_modules.sh'
      - 'scripts/ci/test_r0s_target_files_preflight.py'
      - 'scripts/ci/test_r0s_target_files_zip.py'
      - 'scripts/r0s/check_unpacked_boot_header.sh'
      - 'scripts/ci/test_r0s_boot_header_labels.sh'
      - 'scripts/ci/test_r0s_boot_chain.sh'
      - 'scripts/ci/check_r0s_ota_map.sh'
      - 'staging/r0s/ksunext/**'
      - 'scripts/ci/check_r0s_ksu_staging.sh'
      - 'scripts/utils/install_utils.sh'
      - 'scripts/internal/build_full_ota_zip.sh'
      - '.github/workflows/r0s-config.yml'

jobs:
  config:
    name: Native config parity only (no firmware or ROM build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Validate r0s source and target configuration
        shell: bash
        run: bash scripts/ci/check_r0s_config.sh
      - name: Test extracted-firmware inspector using synthetic data only
        shell: bash
        run: bash scripts/ci/test_r0s_firmware_inspector.sh
      - name: Check native boot metadata safety gates (synthetic only)
        shell: bash
        run: bash scripts/ci/test_r0s_boot_chain.sh
      - name: Syntax-check the read-only native recovery inspector
        shell: bash
        run: bash -n scripts/r0s/inspect_recovery_abi.sh && bash -n scripts/r0s/audit_stock_recovery_updater.sh && bash -n scripts/r0s/audit_recovery_ota_trust.sh && bash -n scripts/r0s/audit_recovery_candidates.sh && python3 scripts/r0s/inspect_twrp_gzh3_userspace.py --self-test && python3 scripts/r0s/audit_recovery_runtime_abi.py --self-test
      - name: Test S901B FYI3 to GZH3 installation contract syntax (synthetic only)
        shell: bash
        run: python3 scripts/r0s/audit_install_prerequisites.py --self-test
      - name: Test E3099-only TWRP probe archive guard (synthetic)
        shell: bash
        run: python3 scripts/r0s/make_twrp_abort_probe.py --self-test
      - name: Test actual-OTA binary to existing TWRP static-ABI inspector (synthetic only)
        shell: bash
        run: python3 scripts/r0s/audit_ota_updater_twrp.py --self-test
      - name: Test A16 pinned custom kernel and KernelSU preparation (no clone)
        shell: bash
        run: bash scripts/r0s/build_extremekrnl_a16.sh --self-test
      - name: Test A16 custom-kernel artifact inspector (syntax only, no build)
        shell: bash
        run: bash scripts/r0s/audit_extremekrnl_a16_candidate.sh --self-test
      - name: Test native GZH3 vs ExtremeKRNL vendor_boot comparison (synthetic only)
        shell: bash
        run: python3 scripts/r0s/compare_extremekrnl_gzh3_a16.py --self-test
      - name: Check pinned A16 hybrid builder and late integration fixtures (synthetic only)
        shell: bash
        run: python3 scripts/r0s/reconcile_extremekrnl_gzh3_a16.py --self-test && python3 scripts/r0s/integrate_extremekrnl_a16.py --self-test && bash -n scripts/make_rom.sh && bash -n target/r0s/late_patches/extremekrnl/customize.sh
      - name: Test host-only single full OTA archive safety gate (synthetic only)
        shell: bash
        run: python3 scripts/r0s/build_full_ota_guarded.py --self-test
      - name: Test X.509 OTA recovery trust comparator (synthetic only)
        shell: bash
        run: python3 scripts/ci/test_r0s_recovery_ota_certificates.py
      - name: Test native recovery/OTA fstab consistency (synthetic only)
        shell: bash
        run: bash scripts/ci/test_r0s_recovery_ota_map.sh
      - name: Exercise actual upstream dynamic partition op-list generator
        shell: bash
        run: bash scripts/ci/test_r0s_ota_op_list.sh
      - name: Test distinct Android boot and vendor_boot image header labels
        shell: bash
        run: bash scripts/ci/test_r0s_boot_header_labels.sh
      - name: Syntax-check read-only assembled workdir audit
        shell: bash
        run: bash -n scripts/r0s/inspect_built_workdir.sh
      - name: Syntax-check real-stock and workdir ramdisk comparison
        shell: bash
        run: bash -n scripts/r0s/inspect_postbuild_boot_ramdisks.sh
      - name: Test exact native A16 kernel PROCA delta (synthetic only)
        shell: bash
        run: python3 scripts/ci/test_r0s_proca_kernel_delta.py
      - name: Test guarded target-files capacity and firmware preflight (synthetic only)
        shell: bash
        run: python3 scripts/ci/test_r0s_target_files_preflight.py && bash -n scripts/r0s/build_target_files_guarded.sh && bash -n scripts/r0s/audit_target_files_host.sh && bash -n scripts/r0s/audit_packaged_kernel_modules.sh
      - name: Test native GZH3 target-files ZIP checker (synthetic only)
        shell: bash
        run: python3 scripts/ci/test_r0s_target_files_zip.py
      - name: Validate provisional updater-script map and safety lock
        shell: bash
        run: bash scripts/ci/check_r0s_ota_map.sh
      - name: Verify inactive KernelSU Next manager reuse staging
        shell: bash
        run: bash scripts/ci/check_r0s_ksu_staging.sh
